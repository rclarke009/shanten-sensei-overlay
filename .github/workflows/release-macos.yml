name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install torch==2.2.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Download bundled Mortal model (AGPL)
        run: bash scripts/download-bundled-model.sh

      - name: Prepare native libraries
        run: bash scripts/prepare-macos-bundle.sh

      - name: Build app bundle
        run: pyinstaller ShantenSensei.spec --noconfirm

      - name: Require signing secrets on tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          if [[ -z "${HAS_CERT}" ]]; then
            echo "Tagged releases require overlay secret MACOS_CERTIFICATE_P12 (and notary secrets)." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Sign app
        if: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        run: bash scripts/sign-macos-app.sh "dist/Shanten Sensei.app"

      - name: Notarize and staple app
        if: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-macos.sh "dist/Shanten Sensei.app"

      - name: Create DMG
        run: bash scripts/create-macos-dmg.sh

      - name: Sign, notarize, and staple DMG
        if: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash scripts/sign-macos-app.sh dist/ShantenSensei-macOS.dmg
          bash scripts/notarize-macos.sh dist/ShantenSensei-macOS.dmg
          shasum -a 256 dist/ShantenSensei-macOS.dmg > dist/ShantenSensei-macOS.dmg.sha256
          cat dist/ShantenSensei-macOS.dmg.sha256

      - name: Package one-click installer zip
        run: bash scripts/package-installer-zip.sh

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Install-Shanten-Sensei.zip
            scripts/Install-Shanten-Sensei.command
            dist/ShantenSensei-macOS.dmg
            dist/ShantenSensei-macOS.dmg.sha256
            INSTALL.md
            licenses/MORTAL_MODEL_NOTICE.md
            licenses/README.md
            licenses/AGPL-3.0.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ShantenSensei-macOS
          path: |
            dist/ShantenSensei-macOS.dmg
            dist/ShantenSensei-macOS.dmg.sha256
